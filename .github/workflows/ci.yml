name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_evals:
        description: Rodar evals com LLM real
        type: boolean
        default: false
      deploy_aws:
        description: Aplicar o Terraform na AWS
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + unitários + integração com MongoDB e LocalStack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Testes
        run: docker compose --profile test run --rm --build backend-test
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs localstack bootstrap
      - name: Derrubar ambiente
        if: always()
        run: docker compose --profile test down -v

  web:
    name: Front-end (typecheck + testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes
        run: docker compose --profile test run --rm --build --no-deps web-test

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Formatação
        run: docker run --rm -v "$PWD:/repo" -w /repo/infra/terraform hashicorp/terraform:1.9 fmt -check -recursive
      - name: Validação
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo/infra/terraform hashicorp/terraform:1.9 init -backend=false -input=false
          docker run --rm -v "$PWD:/repo" -w /repo/infra/terraform hashicorp/terraform:1.9 validate

  smoke:
    name: Smoke test ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Subir stack
        run: docker compose up -d --build --wait
      - name: Front e API pelo nginx
        run: |
          curl --fail --silent http://localhost:8480/ | grep -q "<title>ZapAgent</title>"
          curl --fail --silent http://localhost:8480/health | grep -q '"ok"'
      - name: Mensagem do simulador até o atendente
        run: docker compose exec -T api python -m zapagent.entrypoints.smoke
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
      - name: Derrubar ambiente
        if: always()
        run: docker compose down -v

  evals:
    name: Evals do agente (LLM real)
    runs-on: ubuntu-latest
    needs: [smoke]
    if: github.event_name == 'workflow_dispatch' && inputs.run_evals
    env:
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.openai.com/v1' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
      LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE }}
      LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar segredo
        run: test -n "$LLM_API_KEY" || (echo "Configure o secret LLM_API_KEY" && exit 1)
      - name: Rodar evals
        run: docker compose --profile evals run --rm --build evals
      - name: Derrubar ambiente
        if: always()
        run: docker compose --profile evals down -v

  publish:
    name: Publicar imagens no GHCR
    runs-on: ubuntu-latest
    needs: [smoke, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nome da imagem em minúsculas
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          target: runtime
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-aws:
    name: Deploy na AWS (Terraform)
    runs-on: ubuntu-latest
    needs: [smoke, terraform]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_aws && vars.AWS_DEPLOY_ROLE_ARN != ''
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_whatsapp_app_secret: ${{ secrets.WHATSAPP_APP_SECRET }}
      TF_VAR_whatsapp_verify_token: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Init com estado remoto
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=zapagent/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"
      - name: Plan
        run: terraform plan -input=false -out=tfplan
      - name: Apply
        run: terraform apply -input=false tfplan
      - name: Saídas
        run: terraform output
